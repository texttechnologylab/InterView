# coturn - TURN relay for InterView.
#
# Optional component. Needed when a client cannot be reached with STUN alone,
# which is the normal case for VR headsets on university or hotel wifi.
#
# Every IP below is deployment specific. Replace them before starting.

# --- Ports -------------------------------------------------------------------
# The public port is 3478 (what clients are configured with). The reverse proxy
# / firewall maps it onto this one, so coturn can run unprivileged.
listening-port=13478
# tls-listening-port=5349    # uncomment once you have certificates

# --- Addresses ---------------------------------------------------------------
# listening-ip / relay-ip : the host's own address.
# external-ip=PUBLIC/PRIVATE : required whenever the host is behind 1:1 NAT, so
# coturn advertises the routable address instead of the internal one.
listening-ip=CHANGEME_PRIVATE_IP
relay-ip=CHANGEME_PRIVATE_IP
external-ip=CHANGEME_PUBLIC_IP/CHANGEME_PRIVATE_IP

# Relay port range. Must be open in the firewall, and must not overlap with the
# rtp_port_range in janus/conf/janus.jcfg (20000-20100).
min-port=50000
max-port=51000

# --- Authentication ----------------------------------------------------------
fingerprint
lt-cred-mech
realm=turn.example.org

# Static long-term credential. Note that these credentials necessarily ship to
# the browser in the web client's settings.js and are visible in the Unity
# scene, so treat them as public and rotate them on a schedule.
# For a hardened setup, switch to `use-auth-secret` with time-limited tokens.
user=CHANGEME_TURN_USER:CHANGEME_TURN_PASSWORD

cli-password=CHANGEME_CLI_PASSWORD

# --- Peers -------------------------------------------------------------------
# WARNING: this permits relaying to any address, including loopback and the
# local network. It is what the FACES deployment ran with, but combined with
# static credentials it makes the server an open relay into the host's network.
# Narrow `allowed-peer-ip` and drop the loopback/local allowances unless you
# specifically need them.
allow-loopback-peers
allow-localhost-peers
allow-local-ip
allowed-peer-ip=0.0.0.0-255.255.255.255

# --- Behaviour ---------------------------------------------------------------
stale-nonce=600
total-quota=100
verbose
log-file=stdout
