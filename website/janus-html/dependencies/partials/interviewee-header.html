<div class="fixed top-0 left-0 right-0 bg-white shadow-md z-40 px-6 py-3 flex items-center justify-between h-16">
	<div class="flex items-center space-x-4">
		<div class="flex items-center space-x-2">
			<div class="w-3 h-3 bg-green-600 rounded-full animate-pulse"></div>
			<h1 class="text-xl font-bold text-gray-800"><i class="fas fa-video mr-2 text-blue-600"></i>Interview-Sitzung</h1>
		</div>
		<span class="text-sm text-gray-500">ID:&nbsp;<span id="room-id-display" class="font-mono font-semibold text-gray-700"></span></span>
		<span class="badge bg-info hide px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-800" id="you"></span>
		<span id="record-dot" class="hide flex items-center space-x-1 text-red-600 text-sm font-semibold ml-2" title="Diese Sitzung wird aufgezeichnet">
			<span class="w-2 h-2 bg-red-600 rounded-full recording-pulse"></span><span>REC</span>
		</span>
	</div>
	<div class="flex items-center space-x-3">
		<button id="diagnostic-btn" type="button" title="Diagnose-Bericht anzeigen"
				class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-medium flex items-center gap-2">
			<i class="fas fa-stethoscope"></i><span class="hidden sm:inline">Diagnose</span>
		</button>
	</div>
</div>
