<style>
	body { 
		margin: 0; 
		padding: 0; 
		overflow: hidden; 
		font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
	}
	.draggable-video {
		touch-action: none;
		user-select: none;
	}
	.video-container video {
		width: 100%;
		height: 100%;
		object-fit: cover;
		border-radius: 0.5rem;
	}
	.resizable {
		border: 2px solid transparent;
		transition: border-color 0.2s;
	}
	.resizable:hover {
		border-color: #3b82f6;
	}
	.drag-handle {
		cursor: move;
	}
	.no-video-container {
		display: flex;
		align-items: center;
		justify-content: center;
		background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		border-radius: 0.5rem;
		color: white;
		font-size: 3rem;
	}
	.top-right {
		position: absolute;
		top: 0.5rem;
		right: 0.5rem;
		z-index: 10;
	}
	.relative {
		position: relative;
	}
	.hide {
		display: none !important;
	}
	#bitrate {
		min-width: 150px;
	}
	.video-panel {
		box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
		backdrop-filter: blur(10px);
		background: rgba(255, 255, 255, 0.95);
	}
	.minimized {
		height: 60px !important;
		overflow: hidden;
	}
	.minimized .video-body {
		display: none;
	}
	.resize-handle {
		position: absolute;
		bottom: 0;
		right: 0;
		width: 20px;
		height: 20px;
		cursor: nwse-resize;
		z-index: 1000;
		background: linear-gradient(135deg, transparent 50%, rgba(59, 130, 246, 0.3) 50%);
	}
	.resize-handle:hover {
		background: linear-gradient(135deg, transparent 50%, rgba(59, 130, 246, 0.6) 50%);
	}
</style>

<script>
// Make video panels draggable and resizable
$(document).ready(function() {
	// Initialize draggable functionality
	interact('.draggable-video').draggable({
		allowFrom: '.drag-handle',
		ignoreFrom: '.resize-handle',
		inertia: true,
		modifiers: [
			interact.modifiers.restrictRect({
				restriction: 'parent',
				endOnly: true
			})
		],
		autoScroll: true,
		listeners: {
			move: dragMoveListener
		}
	}).resizable({
		edges: { left: false, right: true, bottom: true, top: false },
		allowFrom: '.resize-handle',
		listeners: {
			move(event) {
				var target = event.target;
				var x = (parseFloat(target.getAttribute('data-x')) || 0);
				var y = (parseFloat(target.getAttribute('data-y')) || 0);

				// Update size
				target.style.width = event.rect.width + 'px';
				target.style.height = event.rect.height + 'px';

				// Keep transform as is (no adjustment needed for top-left positioned elements)
				target.style.transform = 'translate(' + x + 'px,' + y + 'px)';

				target.setAttribute('data-x', x);
				target.setAttribute('data-y', y);
			}
		},
		modifiers: [
			interact.modifiers.restrictSize({
				min: { width: 200, height: 150 }
			})
		],
		inertia: true
	});

	function dragMoveListener(event) {
		var target = event.target;
		var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
		var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

		target.style.transform = 'translate(' + x + 'px, ' + y + 'px)';

		target.setAttribute('data-x', x);
		target.setAttribute('data-y', y);
	}

	window.dragMoveListener = dragMoveListener;
	
	// Observe when remote panels should be shown
	const observer = new MutationObserver(function(mutations) {
		mutations.forEach(function(mutation) {
			if (mutation.type === 'childList' && mutation.target.id.startsWith('videoremote')) {
				const remoteId = mutation.target.id.replace('videoremote', '');
				if (mutation.target.children.length > 0) {
					// Show the corresponding panel when video is added
					$('#remote-video-panel-' + remoteId).removeClass('hide');
				}
			} else if (mutation.type === 'childList' && mutation.target.id === 'videolocal') {
				// When local video is added, hide the join dialog
				if (mutation.target.children.length > 0) {
					$('#videojoin').addClass('hide');
				}
			}
		});
	});
	
	// Observe all remote video containers
	for (let i = 1; i <= 5; i++) {
		const element = document.getElementById('videoremote' + i);
		if (element) {
			observer.observe(element, { childList: true, subtree: true });
		}
	}
	
	// Observe local video container to hide join dialog
	const localVideoElement = document.getElementById('videolocal');
	if (localVideoElement) {
		observer.observe(localVideoElement, { childList: true, subtree: true });
	}
});

function minimizePanel(panelId) {
	$('#' + panelId).toggleClass('minimized');
}

function closePanel(panelId) {
	$('#' + panelId).addClass('hide');
}

function toggleLayoutMode() {
	// Reset all panels to their original positions
	$('.draggable-video').each(function() {
		$(this).css('transform', 'translate(0px, 0px)');
		$(this).attr('data-x', 0).attr('data-y', 0);
	});
}

// Run iframe code function
function runIframeCode() {
	try {
		const iframe = document.getElementById('questionnaire-iframe');
		if (!iframe) {
			console.error('Iframe not found');
			return;
		}
		
		// Try to access iframe content (will fail for cross-origin)
		try {
			const iframeWindow = iframe.contentWindow;
			const result = iframeWindow.eval(`
				[...new Set($(".answer-item").not(".hidden").children("label").toArray().map((e, index) => e.innerHTML?.trim()))]
			`);
			console.log('Iframe code result:', result);
			return result;
		} catch (e) {
			console.error('Cannot access iframe due to same-origin policy:', e);
			alert('Cannot access iframe content - it is from a different domain. You need to run this code from the browser console after selecting the iframe context.');
		}
	} catch (error) {
		console.error('Error running iframe code:', error);
	}
}
</script>
