server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pretty routes for the two interview pages
    location = /interview {
        try_files /interview.html =404;
    }
    location /interview/ {
        try_files /interview.html =404;
    }
    location = /interviewer {
        try_files /interviewer.html =404;
    }
    location /interviewer/ {
        try_files /interviewer.html =404;
    }
    location = /chat {
        try_files /chat.html =404;
    }
    location /chat/ {
        try_files /chat.html =404;
    }

    # Original Janus demo set, browsable under /demos/
    location /demos/ {
        try_files $uri $uri/ =404;
    }

    # Default static serving
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:mjs|js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
